name: manual

# REQUIRED-CHECK SHAPE (2026-09-23). No `paths:` filter on either trigger, so
# this workflow's single job reports its context on EVERY push (master, main,
# and the `ci/**` staging branches scripts/push-via-staging.sh uses) and on
# EVERY pull request -- a path-filtered workflow never starts on a commit
# outside its paths, and a required context that never appears blocks that
# commit forever. The path scope moved into the first step,
# `ci/doc-gate-guard.sh`, which decides whether the heavy steps run; an
# irrelevant commit gets a fast green. This is examples.yml's always-run PR
# pattern, extended to `push` so the context also appears on a code-only
# staging push. Tag pushes always run the full gate.
#
# Watched paths: docs/manual/ plus anything it reaches outside itself, DERIVED
# by ci/doc-gate-paths.py; `--also` adds the mermaid cache tool, this
# workflow, the guard, and crates/ + Cargo.{toml,lock} -- the audit replays
# every transcript against the mnemonic binary built from THIS tree, so a code
# change can drift a golden without touching docs/.

on:
  push:
    branches: [main, master, 'ci/**']
    tags:
      - 'manual-v*'
  pull_request:
  workflow_dispatch:

jobs:
  manual:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Self-test the doc-gate guard (always runs, BEFORE the guard decides)
        # A gate whose own tests no job runs is a hypothesis. This step has no
        # `if:` and sits before the guard, so it runs on every push (master,
        # main, ci/**), every tag, every PR and every dispatch that starts this
        # job -- i.e. whenever the required `manual` context is produced -- and
        # a guard regression REDs that context. It needs only git + python3
        # (preinstalled on ubuntu-latest) and the full history checked out
        # above; it builds a scratch origin under $RUNNER_TEMP and never
        # touches the real remote.
        env:
          DOC_GATE_TEST_TMP: ${{ runner.temp }}/doc-gate-test
        run: bash ci/doc-gate-guard.test.sh

      - name: Detect relevant changes (always runs; the heavy steps below are gated on it)
        id: guard
        # Fail-SAFE (ci/doc-gate-guard.sh): errs only toward RUNNING the gate.
        # --book + --also are this gate's whole path scope -- there is no
        # `paths:` filter on the triggers any more, so the context reports on
        # every push and PR and can be a REQUIRED check.
        run: bash ci/doc-gate-guard.sh --book docs/manual --also '^(docs/tools/render-mermaid-cache\.py$|\.github/workflows/manual\.yml$|ci/doc-gate-(guard\.sh|paths\.py)$|ci/doc-(gate-guard|flag-lint)\.test\.sh$|crates/|Cargo\.(toml|lock)$)'

      - name: Install pandoc + texlive
        if: steps.guard.outputs.relevant == 'true'
        # No chromium (and no mermaid-filter / mermaid-cli below): the
        # build runs MERMAID_FILTER=skip and consumes the checked-in
        # figures/cache/ PDFs. See `ci-chromium-drop` (closed) in
        # docs/manual/FOLLOWUPS.md for the migration record.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            texlive-xetex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-extra-utils \
            make

      - name: Set up Node.js
        if: steps.guard.outputs.relevant == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install npm tools (lints only)
        if: steps.guard.outputs.relevant == 'true'
        # mermaid-filter / mermaid-cli intentionally absent — the cache
        # is checked into git; CI never regenerates it. Contributors who
        # need to regen the cache install mmdc + chromium locally.
        run: |
          npm install -g \
            markdownlint-cli2@^0.13 \
            cspell@^8

      - name: Install lychee
        if: steps.guard.outputs.relevant == 'true'
        run: |
          LARCH=x86_64-unknown-linux-gnu
          curl -fsSL "https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-${LARCH}.tar.gz" \
            | sudo tar -xz --strip-components=1 -C /usr/local/bin "lychee-${LARCH}/lychee"
          sudo chmod +x /usr/local/bin/lychee

      - name: Install mk-cli
        if: steps.guard.outputs.relevant == 'true'
        # Use package-name selector (`mk-cli`) instead of `--bin mk`: the
        # mnemonic-key workspace ships multiple binaries (mk-codec's
        # gen_mk_vectors + mk-cli's mk), and cargo refuses --bin disambig
        # against a multi-binary workspace.
        run: cargo install --git https://github.com/bg002h/mnemonic-key --tag mk-cli-v0.13.0 mk-cli

      - name: Install md-cli
        if: steps.guard.outputs.relevant == 'true'
        # Mirrors the mk-cli install pattern above. Use package-name
        # selector (`md-cli`) instead of `--bin md`: the descriptor-mnemonic
        # workspace ships multiple binaries. The `--features cli-compiler`
        # flag matches scripts/install.sh:35's component_info pin.
        run: cargo install --git https://github.com/bg002h/descriptor-mnemonic --tag descriptor-mnemonic-md-cli-v0.20.3 md-cli --features cli-compiler

      - name: Install ms-cli
        if: steps.guard.outputs.relevant == 'true'
        # Mirrors the mk-cli + md-cli install patterns above.
        run: cargo install --git https://github.com/bg002h/mnemonic-secret --tag ms-cli-v0.20.1 ms-cli

      - name: Build mnemonic binary (debug)
        if: steps.guard.outputs.relevant == 'true'
        # Debug binary is sufficient for transcript-replay byte-comparison.
        # Behavior under test is identical between debug/release modulo
        # panic-handler verbosity; mnemonic never panics in normal flow.
        run: cargo build --bin mnemonic

      - name: Audit manual (lint + verify-examples with real mnemonic binary)
        if: steps.guard.outputs.relevant == 'true'
        working-directory: docs/manual
        # All flag values below are constants or controlled built-ins
        # ($GITHUB_WORKSPACE); no untrusted github.event.* fields per
        # https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/.
        run: |
          make audit \
            MNEMONIC_BIN="$GITHUB_WORKSPACE/target/debug/mnemonic" \
            MD_BIN=md \
            MS_BIN=ms \
            MK_BIN=mk \
            FIXTURES_DIR="$GITHUB_WORKSPACE/crates/mnemonic-toolkit/tests/fixtures/wallet_import"

      - name: Mutation-test the flag lint (ci/doc-flag-lint.test.sh)
        # Tests the LINT, not the guard, so it may sit behind the guard: every
        # input it depends on -- docs/manual/tests/lint.sh, the chapters, the
        # CLI pins in this file, and this test script (in --also above) -- makes
        # the guard answer relevant=true. It needs the pinned CLIs installed
        # above, which is why it is not in the always-run self-test step.
        if: steps.guard.outputs.relevant == 'true'
        run: |
          MNEMONIC_BIN="$GITHUB_WORKSPACE/target/debug/mnemonic" \
          MD_BIN="$(command -v md)" MS_BIN="$(command -v ms)" MK_BIN="$(command -v mk)" \
            bash ci/doc-flag-lint.test.sh

      - name: Build PDF
        if: steps.guard.outputs.relevant == 'true'
        # MERMAID_FILTER=skip is the Makefile default; explicit here for
        # clarity. The build consumes the checked-in figures/cache/.
        working-directory: docs/manual
        run: make pdf MERMAID_FILTER=skip

      - name: Verify PDF
        if: steps.guard.outputs.relevant == 'true'
        working-directory: docs/manual
        run: test -f build/m-format-manual.pdf && ls -lh build/m-format-manual.pdf

      - name: Build HTML
        if: steps.guard.outputs.relevant == 'true'
        # Self-contained pandoc --standalone render (embedded CSS); opens in
        # any browser with no server — the no-PDF-viewer release asset.
        # `make audit` above already builds this HTML (anchor-check consumes
        # it), but this explicit `make html` keeps the asset present even if
        # the audit prerequisite chain changes, and pairs the Verify step
        # below. The target is idempotent (no rebuild if up to date).
        working-directory: docs/manual
        run: make html MERMAID_FILTER=skip

      - name: Verify HTML
        if: steps.guard.outputs.relevant == 'true'
        working-directory: docs/manual
        run: test -f build/m-format-manual.html && ls -lh build/m-format-manual.html

      - name: Upload PDF as workflow artifact
        if: steps.guard.outputs.relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: m-format-manual-pdf
          path: docs/manual/build/m-format-manual.pdf

      - name: Upload HTML as workflow artifact
        if: steps.guard.outputs.relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: m-format-manual-html
          path: docs/manual/build/m-format-manual.html

      - name: Ensure GitHub release exists for this tag
        if: startsWith(github.ref, 'refs/tags/manual-v')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ! gh release view "$REF_NAME" >/dev/null 2>&1; then
            gh release create "$REF_NAME" --title "$REF_NAME" --latest=false --generate-notes || true
          fi

      - name: Upload PDF to release (on manual-v* tag)
        if: startsWith(github.ref, 'refs/tags/manual-v')
        env:
          REF_NAME: ${{ github.ref_name }}
        working-directory: docs/manual
        run: gh release upload "$REF_NAME" build/m-format-manual.pdf --clobber

      - name: Upload HTML to release (on manual-v* tag)
        if: startsWith(github.ref, 'refs/tags/manual-v')
        env:
          REF_NAME: ${{ github.ref_name }}
        working-directory: docs/manual
        run: gh release upload "$REF_NAME" build/m-format-manual.html --clobber
