name: shared-drift
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: "also run the nightly jobs (no nightly jobs in this workflow; accepted so the release gate can pass -f full=true everywhere)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/master' }}

jobs:
  drift:
    name: shared CI files match the other public repos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Self-test the drift check
        shell: bash
        run: bash ci/shared-drift.test.sh
      - name: Compare the shared CI files with the other public repos
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/shared-drift.sh
