name: miniscript-fork-tripwire

# Watches for the ONE upstream event that lets the `[patch.crates-io]` fork pin
# go: a single crates.io miniscript release that carries the fork-only APIs the
# toolkit uses. Kept by decision 2026-11-03 (architect miniscript-13-2): no 13.x
# port; drop when one release carries #910, #915, #911 and #929; the tripwire
# watches for it.
#
# WHAT THE PIN IS. `Cargo.toml`'s `[patch.crates-io]` points `miniscript` at an
# unreleased git rev. Against it, crates.io 13.2.0 (2026-10-17) delivered only
# the taptree Display fix (#953, as backport #1039). Still absent from 13.2.0:
# #910 (Terminal::SortedMultiA), #915 (Terminal::SortedMulti into Terminal),
# #911 (Descriptor::derive_at_index, into_definite) and #929 (generic
# Descriptor::plan). Two consequences ride on them:
#
#   1. `tr(sortedmulti_a)` restore stays refused (FOLLOWUP
#      `taproot-coverage-cycle-on-miniscript-gt-13-1-0`).
#   2. crates.io publication of `mnemonic-toolkit` is IMPOSSIBLE, and therefore
#      of `mnemonic-gui` too (it depends on the toolkit by git tag). A `[patch]`
#      is neither published nor honoured downstream, so a published toolkit
#      would resolve stock miniscript and fail to compile for every consumer.
#
# THE RULE (ci/miniscript-tripwire.py; tests: ci/miniscript-tripwire.test.sh).
# RED iff the highest non-yanked, non-prerelease crates.io miniscript V is above
# BASELINE AND (V's src/ carries all four fork-only markers OR V's major is above
# BASELINE's major). Otherwise GREEN, with a notice naming what a newer V lacks.
#   M1 `SortedMultiA(Threshold<`  M2 `SortedMulti(Threshold<`
#   M3 `pub fn derive_at_index`   M4 `pub fn into_definite`
# Baseline-only fired on every 13.x point release and could not tell a backport
# from the real event; "14.x only" would miss a 13.x minor that carries the API.
# Markers plus the major check cover both. Every run first scans
# vendor/miniscript (the pinned rev), which must show 4/4, so the scan can
# fail and a green means something. The downloaded crate's sha256 must equal
# the index `cksum`; a transport error, an empty index, a checksum mismatch or a
# broken positive control all fail closed.
#
# WHY AN INDEX QUERY AND NOT A COMPILE PROBE. The dependency is
# `miniscript = { version = "13" }`, so cargo would never resolve a 14.x and a
# compile probe would stay green through a new major. The index is range-blind.
#
# NOT AUTO-DROP, AND NOT A FRESHNESS CHECK. A red starts a drop check (see the
# NEXT STEPS it prints). It cannot see master-only fixes no release carries
# (e.g. rust-miniscript #1046), so it does not say whether the pin is current.

on:
  schedule:
    - cron: '0 6 * * 1'          # Mondays 06:00 UTC
  workflow_dispatch:              # on-demand, e.g. right before planning a cycle
  push:
    paths:
      - '.github/workflows/miniscript-fork-tripwire.yml'   # born-green self-test
      - 'ci/miniscript-tripwire.py'
      - 'ci/miniscript-tripwire.test.sh'
      - 'ci/fixtures/miniscript-index-13x.jsonl'

permissions:
  contents: read

jobs:
  tripwire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Assert the patch pin still exists (fail-closed)
        # If the patch is gone or restructured, this job is stale and its GREEN
        # would be meaningless — a silent false-negative on the exact condition
        # it exists to watch. Fail loudly instead.
        run: |
          if ! grep -qE '^\s*miniscript\s*=\s*\{\s*git\s*=' Cargo.toml; then
            echo "::error::miniscript [patch.crates-io] pin not found in Cargo.toml." \
                 "Either the fork was dropped (then DELETE this workflow and close" \
                 "FOLLOWUP taproot-coverage-cycle-on-miniscript-gt-13-1-0) or the pin" \
                 "moved (then update this grep). Failing closed."
            exit 1
          fi
          echo "patch pin present:"
          grep -nE '^\s*miniscript\s*=\s*\{\s*git\s*=' Cargo.toml

      - name: Classifier tests (RED rows a-g, offline)
        run: bash ci/miniscript-tripwire.test.sh

      - name: Query crates.io for a release newer than the baseline
        env:
          # The highest miniscript release known NOT to carry the fork-only
          # APIs. 13.2.0 checked 2026-11-03: #910/#915/#911/#929 absent. Raise
          # it ONLY after a red's drop check fails, with a dated comment naming
          # what was missing.
          BASELINE: '13.2.0'
        run: |
          set -euo pipefail
          # Sparse index = the same source cargo resolves from. A transport
          # failure stays RED, never a silent pass.
          curl -sS --fail --retry 3 --retry-delay 5 \
            https://index.crates.io/mi/ni/miniscript -o /tmp/miniscript.index
          test -s /tmp/miniscript.index
          python3 -I ci/miniscript-tripwire.py --baseline "$BASELINE" \
            --index /tmp/miniscript.index --control-dir vendor/miniscript/src
