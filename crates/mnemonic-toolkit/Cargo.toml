[package]
name = "mnemonic-toolkit"
version = "0.105.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Engraving-bundle CLI for the m-format Bitcoin self-custody backup star (ms1 + mk1 + md1)."
documentation = "https://docs.rs/mnemonic-toolkit"
readme = "README.md"
keywords = ["bitcoin", "bip39", "bip93", "engraving", "self-custody"]
categories = ["cryptography::cryptocurrencies", "command-line-utilities"]

[[bin]]
name = "mnemonic"
path = "src/main.rs"

# `cfg(fuzzing)` is set by cargo-fuzz only (via `--cfg fuzzing`) to activate the
# `cfg(fuzzing)`-gated `parse_descriptor` mount in `src/lib.rs` (see that file's
# header + `fuzz/`). It is unknown to every normal build, so without this
# check-cfg declaration clippy `-D warnings` (CI rust.yml) would HARD-FAIL on the
# `unexpected_cfgs` lint. This line is the only normal-build-visible change of
# the fuzz target; it has no runtime effect.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[dependencies]
# ms-codec 0.7 vendored codex32 inline (Cycle-B, shape A) and dropped the
# external `codex32` crate; `friendly_ms_codec` now names the codex32 share-error
# types via `ms_codec::codex32::` (no direct codex32 dep).
ms-codec = "0.7"
mk-codec = "0.4.1"
# md-codec 0.44.0 by git TAG, not crates.io, and for exactly the reason the
# `[patch.crates-io] miniscript` at the workspace root exists: crates.io is
# STALE and cannot be refreshed. md-codec is unpublishable while it depends on
# the patched miniscript (a `[patch]` never carries into a published crate, and
# a git dependency fails `cargo publish` outright), so crates.io is frozen at
# 0.42.0 -- see descriptor-mnemonic FOLLOWUPS
# `md-codec-unpublishable-while-patched-to-miniscript-master`.
#
# This costs nothing here: `mnemonic-toolkit` is ITSELF unpublishable for the
# same reason and is installed from git+tag (scripts/install.sh), so pinning a
# dependency the same way changes no distribution property.
#
# 0.42.0 -> 0.44.x is what makes `restore`/`bundle` emit a descriptor whose xpub
# header agrees with the origin beside it. Before it, a rendered key serialised
# at depth 0 under a depth-4 origin.
#
# NOT EVERY ARM, and the first draft of this comment said "every rendered key",
# which whole-diff review measured as false. The TAPROOT WALLET-POLICY restore
# arm -- `tr(NUMS, multi_a(...))` and `tr(NUMS, sortedmulti_a(...))` -- does not
# route through md-codec's renderer and still emits depth 0 under a depth-4
# origin. Measured: five other shapes render 4/4, those two render 0/4. Tracked
# as `taproot-wallet-policy-arm-still-renders-depth0`.
#
# DROP this git pin for a plain version when md-codec reaches crates.io again,
# which is gated on the same miniscript release as the [patch] above.
# PINNED BY COMMIT, not by tag. A tag is mutable and a sha is not, which
# matters twice here: this is a funds-adjacent dependency, and the reproducible
# musl build resolves `--offline` against a committed vendor/ tree whose
# `[source]` replacement stanza is keyed on `git+URL?rev=`. A `tag =` dependency
# produces a `?tag=` source id that stanza cannot name, so the Linux artifacts
# silently stopped building -- measured on the v0.103.0 tag, where `man-pages`
# failed with "failed to load source for dependency `md-codec`" and the release
# shipped with no musl binaries at all.
#
# cf35d61a is descriptor-mnemonic-md-cli-v0.19.0 (md-codec 0.47.0, F-449 stage 2):
# wire version 8 and the wire-kind-1 (Liana unspendable) internal key, five new
# Error variants routed in error.rs/friendly.rs, `UNSPENDABLE(liana)` in
# descriptor_to_template (F-642).
md-codec = { git = "https://github.com/bg002h/descriptor-mnemonic", rev = "cf35d61af0f058029df841f4882945e53f86cd4b" }
# Word-Card value engine (P6) — the in-workspace RS/RAID/sync/word codec. The
# toolkit consumes it via the canonical-payload adapter + the `word-card` CLI.
wc-codec = { path = "../wc-codec" }
# P3 (SPEC_constellation_cli_uniformity §6d) — the shared constellation I/O
# library. `mnemonic` adopts exactly TWO items from it: `remedy::history_purge_block`
# and its structured half `remedy::history_purge_recipes`, printed by the argv
# refusal. Taken from the REGISTRY — not by `path`, which does not resolve in a
# fresh CI checkout, and deliberately NOT by `git`+`rev` any more. A git source
# has no published tarball, so neither `Cargo.lock`'s `checksum` nor
# `.cargo-checksum.json`'s `package` can anchor the bytes that get vendored;
# that is precisely the F-354 defect class, and it is why
# `ci/repro/vendor-freshness.sh` must hand-ground every git source it tolerates.
# A registry pin is anchored by cargo itself against an immutable tarball on
# every build, so this crate needs no grounding at all and the gate's unanchored
# set stays exactly one (miniscript). NOTE the module path — `remedy` has no
# root re-export in `lib.rs`, so `mnemonic_io_lib::history_purge_block` is E0425.
mnemonic-io-lib = "0.1.0"
aes = "0.8"
base64 = "0.22"
cbc = "0.1"
crypto-bigint = "0.5"
ctr = "0.9"
flate2 = "1"
hmac = "0.12"
miniscript = { version = "13", default-features = false, features = ["std"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand_chacha = "0.3"
rand_core = { version = "0.6", features = ["std", "getrandom"] }
regex = "1"
sha2 = "0.10"
bip38 = "1.1"
bip39 = { version = "2", features = ["all-languages"] }
# v0.36.0 `mnemonic verify-message` — BIP-322 simple/full message-signature
# VERIFY (rust-bitcoin org crate; depends on bitcoin ^0.32.5 → shares our
# bitcoin 0.32.8, no duplicate). Exact-pinned (0.0.x churn). Legacy
# ("Bitcoin Signed Message") verify uses bitcoin::sign_message directly.
bip322 = "=0.0.11"
bitcoin = { version = "0.32", features = ["base64"] }
clap = { version = "4", features = ["derive"] }
# v0.73.0 `mnemonic gen-man` — roff man-page generation from the compiled clap
# `Command` tree. Requires clap ^4.0 (we are 4.6.1 — satisfied, no clap bump).
clap_mangen = "0.3"
hex = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
similar = "2"
unicode-normalization = "0.1"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
proptest = "1"
# Cycle E (`mk1-repair-set-level-reverify`) P0 — deterministic seeded search
# for the §4.1 pinned BCH-miscorrection anchor + the §4.8 rate harness.
# `rand 0.8` is already resolved transitively (rand_core 0.6 / rand_chacha
# 0.3, both direct `[dependencies]`); this only promotes it to a directly
# nameable dev-dependency for `rand::rngs::StdRng` — no new Cargo.lock
# version, test-only (no production binary impact).
rand = "0.8"
