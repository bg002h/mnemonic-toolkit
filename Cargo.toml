[workspace]
members = ["crates/mnemonic-toolkit", "crates/wc-codec"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Unlicense"
repository = "https://github.com/bg002h/mnemonic-toolkit"
homepage = "https://github.com/bg002h/mnemonic-toolkit"
rust-version = "1.85"

# Pinned to rust-miniscript master rev ff4732e (advanced from 95fdd1c on
# 2026-08-20), carried for taproot fragments not yet in a crates.io release:
#   - PR #910 (Terminal::SortedMultiA) — present.
#   - PR #915 (SortedMulti moved from the descriptor enums into a Terminal) —
#     present. NOTE: an internal cleanup upstream, NOT a standards change.
#     BIP-388 l.138 admits sortedmulti "(inside sh or wsh only)" and BIP-379
#     does not list it as a Miniscript fragment; at this rev upstream parses it
#     at any depth, so it is MORE PERMISSIVE than the standard. md-codec holds
#     the BIP rule.
#   - PR #953 (taptree Display fix for depth-≥2 trees) — present, and the reason
#     for this bump. It was the blocker for depth-≥2 taproot restore.
#
# DEPTH-≥2 TAPROOT RESTORE IS LIVE as of this rev: `restore.rs`'s
# `ensure_taptree_depth_le_one` gate is lifted (now `ensure_taptree_wellformed`,
# keeping only its malformed-tree branch) and the two refusal cells in
# `tests/cli_restore_taproot.rs` are flipped to reconstruction. The card was
# always a faithful backup; only the Display side was broken.
#
# Latest crates.io is 13.1.0 (2026-06-09) and contains NONE of these. DROP this
# [patch] when the first release > 13.1.0 ships carrying #953 AND #910 (verify
# via the miniscript CHANGELOG). Tracked: FOLLOWUP
# `taproot-coverage-cycle-on-miniscript-gt-13-1-0`.
[patch.crates-io]
miniscript = { git = "https://github.com/rust-bitcoin/rust-miniscript", rev = "ff4732e5f75aa555682343cb180fa72ee3e8e9d5" }

[profile.test]
opt-level = 2

[profile.dev]
opt-level = 2
